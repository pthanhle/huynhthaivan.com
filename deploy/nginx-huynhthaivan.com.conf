server {
    listen 80;
    listen [::]:80;
    server_name huynhthaivan.com www.huynhthaivan.com;
    return 308 https://huynhthaivan.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.huynhthaivan.com;

    ssl_certificate /etc/letsencrypt/live/huynhthaivan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huynhthaivan.com/privkey.pem;
    return 308 https://huynhthaivan.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name huynhthaivan.com;

    ssl_certificate /etc/letsencrypt/live/huynhthaivan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huynhthaivan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        proxy_pass http://127.0.0.1:3005;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noimageai";
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
