services:
  huynhthaivan-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huynhthaivan-portfolio-2026
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - NEXT_PUBLIC_SITE_URL=https://huynhthaivan.com
      - NEXT_PUBLIC_CONTACT_EMAIL=huynhthaivan0901@gmail.com
      - NEXT_PUBLIC_CONTACT_PHONE=0932134216
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3005/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
